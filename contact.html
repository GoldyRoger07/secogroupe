<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		*{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: sans-serif;
		}
		body{
			width: 100%;
			height: 100vh;
			display: flex;
			place-content: center;
			place-items: center;
			/* background: #000; */
		}

		.card1{
			width: 190px;
			height: 254px;
			background: #fff;
			position: relative;
			display: flex;
			place-content: center;
			place-items: center;
			overflow: hidden;
			border-radius: 20px;
			transition: all 0.3s linear;
			border: 1px solid #c0c0c0;
			/* box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px; */
		}

		.card1:hover{
			border-color: transparent;
			box-shadow: rgba(0, 0, 0, 0.25) 0px 14px 28px, rgba(0, 0, 0, 0.22) 0px 10px 10px;
		}

		.card1:active{
			border-color: #c0c0c0;
			box-shadow: none;
		}

		.card1:hover .card-body{
			/* border-color: transparent; */
		}

		.card1 h4{
			/* z-index: 1; */
			color: rgb(54, 54, 54);
			
			

		}

		.card1::before{
			content: '';
			position: absolute;
			width: 100px;
			animation: spinCard 3s linear infinite;
			transition: all 0.2s linear;
			background-image: linear-gradient(180deg,#1a5cf1,#fbad19);
			height: 130%;
			
		}

		.card-body{
			position: absolute;
			background: #fff;
			inset: 5px;
			border-radius: 15px;
			display: flex;
			place-content: center;
			place-items: center;
			border: 1px solid #c0c0c0;
		}

		.card1:hover::before{
			
			
		}

		@keyframes spinCard {
			from{
				transform: rotate(0deg);

			}
			to{
				transform: rotate(360deg);
			}
		}

		
		
	</style>
	<link href="//fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
	<link rel="stylesheet" href="assets/css/style-liberty.css">
	<title>Document</title>
</head>
<body>
	
	<div class="card">
		<div class="card-body">
			<div class="d-block">
                            <i class="fas fa-business-time"></i>
                            <h3 class="mt-3 mb-2">Étude de marché</h3>
                            <p>Nous analysons votre marché pour vous aider à mieux comprendre vos clients et identifier les opportunités stratégiques.</p>
            </div>

		</div>
	</div>
	
	<script src="assets/js/bootstrap.min.js"></script>

</body>
</html>
